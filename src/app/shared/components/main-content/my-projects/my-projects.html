<section>
    <div class="content">
        <h2 id="projects" class="project-header">{{ 'PROJECTS.projects' | translate }}</h2>
        <div class="projects">
        
            <!-- Join -->
            <div class="project">
                <div class="project__btns-mobile">
                    <button class="button--secondary"
                        (click)="openLink('https://github.com/nightPrayer90/join')">GitHub</button>
                    <button class="button--primary"
                        (click)="openLink('https://join.m-steguweit.de')">Live
                        Test</button>
                </div>

                <div (click)="openLink('https://join.m-steguweit.de')" class="project__img-wrapper">
                    <img class="project__img-wrapper__img" src="assets/images/join.png" alt="Screenshot of the Join kanban board">
                    <div class="project__img-wrapper__overlay"></div>
                </div>

                <div class="project__desc">
                    <h3 class="project__desc__h3">Join</h3>
                    <p class="project__desc__p">Angular | TypeScript | HTML | CSS | Supabase</p>
                    <p class="project__desc__p">{{ 'PROJECTS.join' | translate }}</p>

                    <div class="project__desc__btns">
                        <button class="button--secondary"
                            (click)="openLink('https://github.com/nightPrayer90/join')">GitHub</button>
                        <button class="button--primary"
                            (click)="openLink('https://join.m-steguweit.de')">Live
                            Test</button>
                    </div>
                </div>
            </div>

            <!-- Pollo Loco -->
            <div class="project revert">
                <div class="project__btns-mobile">
                    <button class="button--secondary"
                        (click)="openLink('https://github.com/nightPrayer90/el-pollo-loco')">GitHub</button>
                    <button class="button--primary"
                        (click)="openLink('https://polloloco.m-steguweit.de')">Live
                        Test</button>
                </div>


                <div (click)="openLink('https://polloloco.m-steguweit.de')" class="project__img-wrapper">
                    <img class="project__img-wrapper__img" src="assets/images/pollo-loco.png" alt="Screenshot of the game El Pollo Loco">
                    <div class="project__img-wrapper__overlay"></div>
                </div>

                <div class="project__desc">
                    <h3 class="project__desc__h3">Pollo Loco</h3>
                    <p class="project__desc__p">JavaScript | HTML | CSS</p>
                    <p class="project__desc__p">{{ 'PROJECTS.polloLoco' | translate }}</p>

                    <div class="project__desc__btns revert-button">
                        <button class="button--secondary"
                            (click)="openLink('https://github.com/nightPrayer90/el-pollo-loco')">GitHub</button>
                        <button class="button--primary"
                            (click)="openLink('https://polloloco.m-steguweit.de')">Live
                            Test</button>
                    </div>
                </div>

            </div>

        </div>
    </div>
</section>
